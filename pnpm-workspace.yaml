packages:
  - theme
  - decks/*

# One place for shared versions; decks and the theme refer to them with "catalog:".
catalog:
  '@slidev/cli': ^53.0.0
  '@slidev/theme-default': latest
  '@slidev/theme-seriph': latest
  '@iconify-json/ph': ^1.2.2
  '@iconify-json/simple-icons': ^1.2.0
  playwright-chromium: ^1.56.0
  vue: ^3.5.22

# @comark/markdown-it imports markdown-it/lib/token.mjs, which markdown-it 15 no longer exports.
overrides:
  markdown-it: ^14.1.0
  dompurify: ^3.4.17
  image-size: ^2.0.4
  chokidar: ^4.0.3
  argparse: ^2.0.1

onlyBuiltDependencies:
  - esbuild
  - playwright-chromium
